name: profile visuals

on:
  schedule:
    - cron: "30 18 * * *" # daily, 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00bfbf&color_dots=#ebedf0,#b3ecec,#66d9d9,#00bfbf,#005757
            dist/snake-dark.svg?palette=github-dark&color_snake=#00bfbf&color_dots=#161b22,#003d3d,#005757,#008f8f,#00bfbf
      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
